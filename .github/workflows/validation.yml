name: Validar orientação ao cidadão
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "data/**"
      - "prompts/**"
      - "tests/test_*.py"
      - "tests/test_questions.json"
      - "tests/usability_tasks.json"
      - "tests/run_usability.py"
      - "scripts/**"
      - ".github/workflows/validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: citizen-assist-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Executar testes de regressão
        run: python -m unittest discover -s tests -v
      - name: Registrar respostas esperadas, obtidas e métricas
        if: always()
        run: python -m src.evaluation
      - name: Executar roteiros de usabilidade na interface real
        if: always()
        run: python -m tests.run_usability
      - name: Instalar ferramentas opcionais de vídeo
        run: |
          python -m pip install --only-binary=:all: pillow==12.2.0 imageio-ffmpeg==0.6.0
      - name: Gerar vídeo da saída capturada do terminal
        run: python scripts/create_demo.py
      - name: Disponibilizar avaliação e demonstração
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: citizen-assist-evidence
          path: |
            tests/results.*
            tests/template_comparison.json
            tests/usability_results.json
            artifacts/citizen-assist-demo.mp4
            artifacts/demo_transcript.txt
          if-no-files-found: error
          retention-days: 30
